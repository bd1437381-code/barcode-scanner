kind = "web"
previewPath = "/"
title = "ماسح باركود"
version = "1.0.0"
id = "artifacts/barcode-scanner"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19789

[services.development]
run = "pnpm --filter @workspace/barcode-scanner run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/barcode-scanner", "run", "build" ]
publicDir = "artifacts/barcode-scanner/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19789"
BASE_PATH = "/"
